# Render.com blueprint: web service + persistent disk so the owner's edits survive restarts.
services:
  - type: web
    name: grench-legal
    runtime: node
    plan: starter            # a persistent disk needs a paid plan
    buildCommand: echo "nothing to build"
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD     # starting password for the owner (she changes it on first login)
        sync: false
      - key: MASTER_PASSWORD    # YOUR developer override password (min 10 characters)
        sync: false
    disk:
      name: grench-data
      mountPath: /var/data
      sizeGB: 1
